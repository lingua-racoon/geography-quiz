<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e5a6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="共テ地理">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>共テ地理 都市クイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/3.5.17/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/1.6.9/topojson.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/datamaps/0.5.9/datamaps.world.min.js"></script>
<style>
/* Layout concept: 地図帳の索引カード。左寄せの一本カラムで、問題→選択肢→解説(地図・特色・狙い目)の順に縦に読む。 */
:root{
  --s1:#0e5f73; --s2:#d9822b; --s3:#6a8f3a; --s4:#8a4f9e; --s5:#c0463b; --s6:#3a7bbf; --s7:#b59a2c; --s8:#6b7b86; --s9:#2f9e8f; --s10:#e07aa0; --s11:#8c6d4b; --s12:#4c5fb0;
  --paper:#f2f5f7; --surface:#ffffff; --ink:#15212b; --muted:#566673; --line:#d3dbe1;
  --accent:#0e5f73; --accent-ink:#ffffff; --accent-soft:#dcecf0;
  --land:#e4e9ed; --sea:#cfe0ec; --border:#8fa0ac; --hit:#f2b04a; --pin:#d1342b;
  --ok:#1b7a4b; --ok-soft:#dff2e8; --ng:#b3261e; --ng-soft:#fbe4e1;
  --display:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
  --body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --s1:#62c1d6; --s2:#f0a24f; --s3:#9cc765; --s4:#c58ad8; --s5:#ff8a7d; --s6:#7fb0e8; --s7:#e0c85a; --s8:#9fb0bb; --s9:#5fd0c0; --s10:#f29ac0; --s11:#c4a07a; --s12:#8e9ff0;
    --paper:#0e151b; --surface:#161f27; --ink:#e8eef2; --muted:#9aaab6; --line:#2a3742;
    --accent:#62c1d6; --accent-ink:#0b1a20; --accent-soft:#17323b;
    --land:#26363f; --sea:#112431; --border:#6d808d; --hit:#d9942f; --pin:#ff6b5e;
    --ok:#62d19b; --ok-soft:#133224; --ng:#ff8a80; --ng-soft:#3a1c19; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --s1:#62c1d6; --s2:#f0a24f; --s3:#9cc765; --s4:#c58ad8; --s5:#ff8a7d; --s6:#7fb0e8; --s7:#e0c85a; --s8:#9fb0bb; --s9:#5fd0c0; --s10:#f29ac0; --s11:#c4a07a; --s12:#8e9ff0;
  --paper:#0e151b; --surface:#161f27; --ink:#e8eef2; --muted:#9aaab6; --line:#2a3742;
  --accent:#62c1d6; --accent-ink:#0b1a20; --accent-soft:#17323b;
  --land:#26363f; --sea:#112431; --border:#6d808d; --hit:#d9942f; --pin:#ff6b5e;
  --ok:#62d19b; --ok-soft:#133224; --ng:#ff8a80; --ng-soft:#3a1c19; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:16px; line-height:1.7;
  padding-block:20px 64px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:720px; margin:0 auto}
button{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.eyebrow{font-size:13px; letter-spacing:.08em; color:var(--muted); font-weight:500; margin:0}
h1{font-family:var(--display); font-weight:800; font-size:clamp(26px,7vw,36px); line-height:1.3; margin:6px 0 10px; text-wrap:balance}
h2{font-size:15px; letter-spacing:.06em; margin:28px 0 10px; color:var(--muted); font-weight:700}
h3{font-size:15px; letter-spacing:.06em; margin:26px 0 8px; font-weight:700; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
h3 small{font-size:13px; color:var(--muted); font-weight:500; letter-spacing:0}
p{margin:0 0 10px}
.lead{max-width:34em; color:var(--muted)}
[hidden]{display:none!important}

/* start screen */
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{
  border:1px solid var(--line); background:var(--surface); border-radius:999px;
  padding:7px 14px; font-size:15px; cursor:pointer; min-height:40px;
}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:700}
.chip .n{font-size:12px; opacity:.75; margin-left:4px; font-variant-numeric:tabular-nums}
.row{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.seg{display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--surface)}
.seg button{border:0; background:transparent; padding:9px 18px; cursor:pointer; min-height:42px; border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); font-weight:700}
.btn{
  border:0; background:var(--accent); color:var(--accent-ink); border-radius:10px;
  padding:13px 22px; font-weight:700; font-size:17px; cursor:pointer; min-height:48px;
}
.btn.ghost{background:transparent; color:var(--accent); border:1.5px solid var(--accent)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:28px}
.note{font-size:13px; color:var(--muted); margin-top:28px; max-width:36em}
.linkbtn{background:none; border:0; color:var(--accent); text-decoration:underline; cursor:pointer; padding:6px 2px; font-size:14px}

/* quiz */
.topbar{display:flex; justify-content:space-between; align-items:baseline; font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums}
.bar{height:5px; background:var(--line); border-radius:3px; margin:8px 0 22px; overflow:hidden}
.bar > i{display:block; height:100%; background:var(--accent); width:0; transition:width .25s}
.qcard{border-left:5px solid var(--accent); padding:4px 0 4px 16px; margin-bottom:22px}
.qcard .ruby{font-size:13px; color:var(--muted); margin:0; letter-spacing:.08em}
.qcard .city{font-family:var(--display); font-weight:800; font-size:clamp(34px,10vw,52px); line-height:1.2; margin:0}
.qcard .ask{margin:6px 0 0; color:var(--muted); font-size:15px}
.choices{display:grid; grid-template-columns:1fr; gap:10px}
@media (min-width:520px){ .choices{grid-template-columns:1fr 1fr} }
.choice{
  display:flex; align-items:center; gap:12px; text-align:left;
  background:var(--surface); border:1.5px solid var(--line); border-radius:12px;
  padding:13px 14px; min-height:56px; cursor:pointer; font-size:17px; min-width:0;
}
.choice .k{
  flex:none; width:28px; height:28px; border-radius:50%; background:var(--accent-soft); color:var(--accent);
  display:grid; place-items:center; font-size:13px; font-weight:700;
}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice:disabled{cursor:default}
.choice.ok{background:var(--ok-soft); border-color:var(--ok)}
.choice.ok .k{background:var(--ok); color:var(--surface)}
.choice.ng{background:var(--ng-soft); border-color:var(--ng)}
.choice.ng .k{background:var(--ng); color:var(--surface)}
.choice.dim{opacity:.55}

/* explanation */
.explain{margin-top:26px; padding-top:6px; border-top:2px solid var(--ink)}
.verdict{padding:12px 14px; border-radius:10px; margin:16px 0 4px; font-size:17px}
.verdict.ok{background:var(--ok-soft); color:var(--ok)}
.verdict.ng{background:var(--ng-soft); color:var(--ng)}
.verdict b{font-size:19px}
.map-wrap{width:100%}
.map{position:relative; border:1px solid var(--line); background:var(--sea); overflow:hidden; border-radius:6px; margin:0}
.map svg{display:block}
.map .datamaps-subunit{fill:var(--land)!important; stroke:var(--border)!important; stroke-width:.9px!important; stroke-dasharray:1.2 2.6; stroke-linecap:round}
.map .datamaps-subunit.hit{fill:var(--hit)!important}
.pin2{fill:#f59e0b; stroke:var(--surface); stroke-width:1.6}
.legend .b{background:#f59e0b; border-radius:50%}
.tap-label{font-family:var(--body); font-weight:700; font-size:14px; fill:var(--ink); paint-order:stroke; stroke:var(--surface); stroke-width:4px; stroke-linejoin:round}
.tap-dot{fill:var(--pin); stroke:var(--surface); stroke-width:1.5}
.map svg .layer-ov, .map svg .river-g, .map svg .pin-g, .map svg .tap-g{pointer-events:none}
.map .datamaps-subunit{cursor:pointer}
.in-lab{font-family:var(--body); font-size:11.5px; fill:#55646f; font-weight:700; paint-order:stroke; stroke:#fff; stroke-width:3px; stroke-linejoin:round; pointer-events:none}
.lins{margin-top:14px}
.lin{margin:0 0 18px}
.ctable{width:100%; border-collapse:collapse; font-size:13px; margin-top:10px}
.ctable th,.ctable td{border:1px solid var(--line); padding:5px 8px; text-align:left; vertical-align:top}
.ctable th{background:var(--surface); color:var(--muted); font-weight:700}
.cnt-in{width:5.5em; margin-left:8px; padding:8px 10px; font:inherit; border:1px solid var(--line); border-radius:8px; background:var(--surface); color:var(--ink)}
.relpie{display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center}
.relpie svg{flex:none}
.relleg{list-style:none; margin:0; padding:0; font-size:13.5px; line-height:1.7}
.relleg i{display:inline-block; width:11px; height:11px; border-radius:2px; margin-right:6px; vertical-align:-1px}
.relnote{font-size:12px; color:var(--muted); margin:4px 0 0}
.gchips{display:flex; flex-wrap:wrap; gap:6px}
.gchip{display:inline-block; padding:2px 9px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font-size:13px}
.gchip.orig{border-color:var(--pin); font-weight:700}
.gchip.past{color:var(--muted); border-style:dashed}
.gnirow b{font-size:17px}
.gnitag{display:inline-block; padding:1px 9px; border-radius:6px; font-size:13px; font-weight:700; color:#1d1d1d; margin-left:6px}
.pin-ring{fill:none; stroke:var(--pin); stroke-width:1.6; opacity:.55}
.pin{fill:var(--pin); stroke:var(--surface); stroke-width:1.6}
.pin-label{font-family:var(--body); font-weight:700; font-size:13px; fill:var(--ink); paint-order:stroke; stroke:var(--sea); stroke-width:3.5px; stroke-linejoin:round}
.fb-grid{stroke:var(--border); stroke-width:.6; stroke-dasharray:1.2 3; opacity:.8}
.fb-text{font-size:10px; fill:var(--muted); font-family:var(--body)}
@media (prefers-reduced-motion: no-preference){
  .pin-ring{transform-box:fill-box; transform-origin:center; animation:ping 1.8s ease-out infinite}
  @keyframes ping{0%{transform:scale(.6); opacity:.8} 100%{transform:scale(2.2); opacity:0}}
}
.legend{display:flex; flex-wrap:wrap; gap:6px 18px; font-size:13px; color:var(--muted); margin:8px 0 0}
.legend i{display:inline-block; width:12px; height:12px; vertical-align:-1px; margin-right:6px; border-radius:2px}
.legend .d{background:var(--pin); border-radius:50%}
.legend .c{background:var(--hit)}
.legend .ar{background:rgba(209,52,43,.26); border:1.5px dashed var(--pin)}
.legend .rv{background:#1f6fd6; height:3px; width:18px; vertical-align:3px; border-radius:2px}
.legend .l{background:transparent; border-top:2px dotted var(--border); height:0; width:18px; vertical-align:3px; border-radius:0}
.traits{margin:0; display:grid; grid-template-columns:5.2em 1fr; gap:0}
.traits dt, .traits dd{margin:0; padding:10px 0; border-bottom:1px solid var(--line)}
.traits dt{font-weight:700; font-size:14px; color:var(--muted)}
.traits dd{min-width:0}
.kcode{display:inline-block; font-weight:700; font-size:13px; background:var(--accent-soft); color:var(--accent); padding:1px 8px; border-radius:6px; margin-right:6px; font-variant-numeric:tabular-nums}
.layers{margin-top:6px}
.lchips{display:flex; flex-wrap:wrap; gap:8px}
.lchip{padding:6px 12px; font-size:14px; min-height:36px}
.lsub[hidden]{display:none}
.lsub{margin-top:8px; padding-left:10px; border-left:3px solid var(--line,#ccc)}
.bsw{margin:6px 0 10px}
.lchip4{padding:4px 12px; font-size:13px; min-height:32px}
body.nob .map .datamaps-subunit{stroke:none!important}
body.nob .ov-border{display:none}
.ln-lbl{font-family:var(--body); font-weight:700; font-size:11px; paint-order:stroke; stroke:var(--surface); stroke-width:3px; stroke-linejoin:round; pointer-events:none}
.theme-btn{position:fixed; top:calc(env(safe-area-inset-top,0px) + 8px); right:max(10px, env(safe-area-inset-right,0px)); z-index:50; padding:4px 10px; min-height:38px; min-width:44px; font-size:20px; line-height:1; font-family:var(--body); color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:999px; cursor:pointer; opacity:.92}
.lq{margin-top:18px}
.chw{margin:6px 0 8px}
.chs{width:100%; height:auto; display:block}
.cht{font-size:12.5px; font-weight:700; margin:8px 0 0}
.chc{font-size:11px; color:var(--muted); margin:2px 2px 2px}
.chs text{font-family:var(--body); fill:var(--ink)}
.chs .cl{font-size:11px} .chs .cv{font-size:10.5px; fill:var(--muted)} .chs .cv.s{font-size:9.5px} .chs .cv.w{fill:var(--accent-ink); font-size:9.5px; font-weight:700} .chs .cv.ct{fill:var(--ink)}
.chs .gl{stroke:var(--line); stroke-width:1} .chs .gl2{stroke:var(--border); stroke-width:2}
.chs .ln{fill:none; stroke-width:2}
.chs .f1{fill:var(--s1)} .chs .st1{stroke:var(--s1)}
.chs .f2{fill:var(--s2)} .chs .st2{stroke:var(--s2)}
.chs .f3{fill:var(--s3)} .chs .st3{stroke:var(--s3)}
.chs .f4{fill:var(--s4)} .chs .st4{stroke:var(--s4)}
.chs .f5{fill:var(--s5)} .chs .st5{stroke:var(--s5)}
.chs .f6{fill:var(--s6)} .chs .st6{stroke:var(--s6)}
.chs .f7{fill:var(--s7)} .chs .st7{stroke:var(--s7)}
.chs .f8{fill:var(--s8)} .chs .st8{stroke:var(--s8)}
.chs .f9{fill:var(--s9)} .chs .st9{stroke:var(--s9)}
.chs .f10{fill:var(--s10)} .chs .st10{stroke:var(--s10)}
.chs .f11{fill:var(--s11)} .chs .st11{stroke:var(--s11)}
.chs .f12{fill:var(--s12)} .chs .st12{stroke:var(--s12)}
.sq-lead{font-size:14.5px; line-height:1.7; margin:6px 0 4px}
.stw tr.mk td{background:var(--accent-soft)}
.sq-opts{display:grid; gap:8px; margin:14px 0 8px}
.sq-opt{display:flex; align-items:center; gap:10px; text-align:left; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink); font:inherit; font-size:14px; cursor:pointer}
.sq-opt.perm{flex-wrap:wrap; gap:6px 12px}
.sq-opts:has(.sq-opt:not(.perm)){grid-template-columns:repeat(3,1fr)}
.sq-no{font-weight:700; color:var(--accent); min-width:1.4em}
.sq-p b{display:inline-block; margin-right:4px; color:var(--muted); font-size:12px}
.sq-opt.ok{border-color:var(--ok); background:var(--ok-soft)}
.sq-opt.ng{border-color:var(--ng); background:var(--ng-soft)}
#sq-fb.sq-fb{border-left:4px solid var(--line); padding:4px 12px; margin:8px 0}
.sq-fb.ok{border-left-color:var(--ok)!important} .sq-fb.ng{border-left-color:var(--ng)!important}
.sq-fb p{margin:6px 0; font-size:13.5px; line-height:1.75}
.sq-fb .sq-v{font-weight:700; font-size:15px}
.sq-fb .sq-rev{font-weight:700; color:var(--accent)}
.stt{margin:18px 0 4px; font-size:15px}
.stt small{color:var(--muted); font-weight:400; font-size:11px; margin-left:6px}
.stw{overflow-x:auto; border:1px solid var(--line); border-radius:10px}
.stw table{border-collapse:collapse; width:100%; font-size:12.5px; font-variant-numeric:tabular-nums}
.stw th,.stw td{padding:6px 8px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap}
.stw th{background:var(--soft,rgba(128,128,128,.12)); font-weight:600; font-size:11.5px; white-space:normal; min-width:52px}
.stw th:first-child,.stw td:first-child{text-align:left; position:sticky; left:0; background:var(--bg); font-weight:600}
.stw th:first-child{background:var(--soft,rgba(128,128,128,.18)); z-index:1}
.stw tr.tot td{font-weight:700}
.stn{font-size:11.5px; color:var(--muted); margin:4px 2px 0}
.lst h3{font-size:15px; margin:18px 0 6px; padding-top:6px; border-top:1px solid var(--line)}
.lrow{display:flex; gap:10px; justify-content:space-between; align-items:baseline; padding:7px 2px; border-bottom:1px solid var(--line); font-size:15px}
.lrow .ln{min-width:0} .lrow .ln small{display:block; color:var(--muted); font-size:11px}
.lrow .la{text-align:right; min-width:0; flex:0 0 46%; cursor:pointer}
.lst.hide .la:not(.rv){color:transparent; background:var(--line); border-radius:6px; user-select:none}
#screen-lq .ov-border{display:inline!important; stroke:#6b7280; stroke-width:.8; stroke-dasharray:none; stroke-linecap:butt}
#screen-lq .datamaps-subunit{stroke-width:.8}
.lq-q{font-weight:700; margin:0 0 10px}
.lq-opts{display:grid; gap:8px; margin:0 0 10px}
.lq-opt{padding:10px 14px; text-align:left; font:inherit; font-size:15px; line-height:1.4; color:var(--ink); background:var(--surface); border:1.5px solid var(--line); border-radius:12px; cursor:pointer}
.lq-opt.ok{border-color:var(--ok); background:var(--ok-soft)}
.lq-opt.ng{border-color:var(--ng); background:var(--ng-soft)}
.lq-fb{margin:0 0 10px; font-weight:700}
.lq-on .lbody{display:none}
.lq-on-r .mk{display:none}
.lq-on .lchips, .lq-on .bsw, .lq-on .lsub{pointer-events:none; opacity:.45}
.lq-on-r #atlas-regions{pointer-events:none; opacity:.45}
.legend-note{font-size:13px; color:var(--muted); margin:8px 0 0}
.lsubt{font-size:13px; color:var(--muted); align-self:center}
.lchip3{padding:4px 10px; font-size:13px; min-height:32px; display:inline-flex; align-items:center; gap:5px}
.cdot{display:inline-block; min-width:16px; height:16px; line-height:16px; border-radius:8px; color:#fff; font-size:10px; font-style:normal; font-weight:700; text-align:center}
.lchip2{padding:4px 10px; font-size:13px; min-height:32px}
.lchip.off{border-style:dashed; color:var(--muted)}
.lbody{margin-top:10px}
.lname{font-weight:700; margin:0 0 6px}
.llegend{display:flex; flex-wrap:wrap; gap:6px 16px; font-size:13px; line-height:1.5}
.llegend span{display:inline-flex; align-items:center; gap:6px; min-width:0}
.llegend i{flex:none; display:inline-block; width:14px; height:14px; border-radius:3px; border:1px solid rgba(0,0,0,.18)}
.llegend i.none{background:#fff}
.lsrc{font-size:12.5px; color:var(--muted); line-height:1.7; margin:10px 0 0}
.lsrc b{color:var(--ink); margin-right:6px}
.lsrc a{color:var(--accent); overflow-wrap:anywhere}
.ov-border{fill:none; stroke:var(--border); stroke-width:.9; stroke-dasharray:1.2 2.6; stroke-linecap:round}
.srcs{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 4px}
.src{font-size:12.5px; line-height:1.5; padding:2px 10px; border-radius:6px; border:1px solid var(--line); background:var(--surface); color:var(--muted)}
.src.t100{border-color:var(--accent); color:var(--accent)}
.src.past{border-color:var(--hit); color:var(--ink); background:color-mix(in srgb, var(--hit) 22%, var(--surface))}
.src.none{border-style:dashed}
.src-note{font-size:13px; color:var(--muted); margin:4px 0 0}
.points{margin:0; padding:0; list-style:none; display:grid; gap:10px}
.points li{padding:10px 12px 10px 14px; background:var(--surface); border:1px solid var(--line); border-left:4px solid var(--hit); border-radius:8px}

/* result */
.score{font-family:var(--display); font-weight:800; font-size:clamp(48px,16vw,76px); line-height:1.1; margin:6px 0 4px; font-variant-numeric:tabular-nums}
.score small{font-size:.38em; font-weight:600; color:var(--muted); margin-left:6px}
.miss{list-style:none; margin:0; padding:0}
.miss li{display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--line)}
.miss b{font-family:var(--display); font-size:18px}
.miss span{color:var(--muted); text-align:right}

<div class="wrap">

  <!-- 開始画面 -->
  <section id="screen-start">
    <button type="button" id="theme-btn" class="theme-btn" aria-label="表示モードを切り替える"></button>
    <h1 id="start-h1">Geography Quiz</h1>

    <h2>問題の種類</h2>
    <div class="seg" id="mode-seg" role="group" aria-label="問題の種類">
      <button type="button" data-m="city" aria-pressed="true">都市・地名 → 国</button>
      <button type="button" data-m="country" aria-pressed="false">国 → 地域</button>
      <button type="button" data-m="legend" aria-pressed="false">分布地図の凡例</button>
    </div>

    <div id="src-block">

    <h2>出題範囲</h2>
    <div class="seg" id="src-seg" role="group" aria-label="出題範囲">
      <button type="button" data-s="src" aria-pressed="true">資料・過去問の地名</button>
      <button type="button" data-s="all" aria-pressed="false">すべて</button>
    </div>
    <p class="src-note" id="src-note"></p>
    </div>

    <div id="lg-block" hidden>
      <h2>出題する分布</h2>
      <div class="chips" id="lg-genres"></div>
      <h2>出題する地域</h2>
      <div class="chips" id="lg-regions"></div>
      <p class="src-note">地図に1つの区分の色だけが塗られています。その区分名を選択肢から選びます。</p>
    </div>
    <h2 id="region-h2">出題する地域</h2>
    <div class="chips" id="region-chips"></div>
    <p id="all-p" style="margin-top:8px"><button class="linkbtn" id="all-on" type="button">すべて選ぶ</button> <button class="linkbtn" id="all-off" type="button">すべて外す</button></p>

    <h2>出題数</h2>
    <div class="seg" id="count-seg" role="group" aria-label="出題数">
      <button type="button" data-n="10" aria-pressed="true">10問</button>
      <button type="button" data-n="0" aria-pressed="false">全問</button>
      <button type="button" data-n="custom" aria-pressed="false">自分で入力</button>
    </div>
    <p id="count-custom" hidden style="margin:10px 0 0"><label>出題数 <input class="cnt-in" id="count-input" type="number" min="1" inputmode="numeric" value="10"> 問</label></p>

    <div class="actions">
      <button class="btn" id="start" type="button">スタート</button>
      <button class="btn ghost" id="start-weak" type="button" hidden>間違えた問題を復習</button>
      <button class="btn ghost" id="open-atlas" type="button">分布地図を見る</button>
      <button class="btn ghost" id="open-list" type="button">収録一覧(暗記用)</button>
      <button class="btn" id="open-sq" type="button">統計クイズ(10問)</button>
      <button class="btn ghost" id="open-stats" type="button">重要統計一覧</button>
    </div>

  </section>

  <!-- 問題画面 -->
  <section id="screen-quiz" hidden>

      <p class="city" id="q-city"></p>

    </div>
    <div class="choices" id="q-choices"></div>
    <div id="q-explain" hidden></div>
  </section>

  <!-- 分布地図 -->
  <section id="screen-atlas" hidden>

    <div id="stats-body"></div>
    <div class="actions"><button class="btn ghost" id="stats-back" type="button">設定に戻る</button></div>
  </section>

  <!-- 収録一覧 -->

    <p class="eyebrow">収録一覧</p>
    <div class="seg" id="list-seg" role="group" aria-label="一覧の種類" style="margin-top:10px">

      <button type="button" data-t="country" aria-pressed="false">国 → 地域</button>

    <div class="lst" id="list-body"></div>
    <div class="actions"><button class="btn ghost" id="list-back" type="button">設定に戻る</button></div>
  </section>

  <section id="screen-sq" hidden>
    <div class="topbar"><span id="sq-progress"></span><span id="sq-score"></span><button class="linkbtn" id="sq-quit" type="button">やめる</button></div>
    <div class="bar"><i id="sq-bar"></i></div>
    <p class="eyebrow" id="sq-th"></p>
    <p class="sq-lead" id="sq-lead"></p>
    <div id="sq-stats"></div>
    <div class="sq-opts" id="sq-opts"></div>
    <div id="sq-fb"></div>
    <div class="actions"><button class="btn" id="sq-next" type="button" hidden>次の問題</button></div>
  </section>
  <section id="screen-sqr" hidden>
    <p class="eyebrow">統計クイズ</p>
    <h2 id="sq-res-text"></h2>
    <div class="actions"><button class="btn" id="sq-again" type="button">もう一度(10問)</button><button class="btn ghost" id="sq-home" type="button">ホームへ</button></div>
  </section>
  <section id="screen-lq" hidden>
    <div class="topbar"><span id="lq-progress"></span><span id="lq-score"></span><button class="linkbtn" id="lq-quit" type="button">やめる</button></div>
    <div class="bar"><i id="lq-bar"></i></div>
    <p class="eyebrow" id="lq-title"></p>
    <div class="map-wrap"><div class="map" id="lmap"></div></div>
    <p class="lq-q" id="lq-q" style="margin-top:14px"></p>

    <p class="lq-fb" id="lq-fb"></p>
    <div id="lq-legend"></div>
    <div class="actions"><button class="btn" id="lq-next" type="button" hidden>次の問題</button></div>

  <!-- 結果画面 -->
  <section id="screen-result" hidden>
    <p class="eyebrow">結果</p>
    <p class="score"><span id="r-score"></span><small id="r-total"></small></p>

    <div id="r-miss-wrap">
      <h2>間違えた問題</h2>

    </div>
    <div class="actions">
      <button class="btn" id="r-again" type="button">もう一度</button>

  </section>

</div>

/* ---------- 凡例クイズ(分布地図): 1つの区分だけ塗った地図から区分名を当てる ---------- */
var LQ = (function(){
  var GENRES = ["rel","lang","fam","eth","agr","col","gni","clim"];
  var gSel = {}, rSel = {}; GENRES.forEach(function(g){ gSel[g] = true; });
  function regions(){ return ["wd"].concat(REGION_ORDER); }
  regions().forEach(function(r){ rSel[r] = true; });
  var S = {n:0, idx:0, score:0, answered:false, ctx:null};
  function shuf(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function nm(c){ return c[1].replace(/[((][^))]*[))]/g,"").trim(); }
  function gLabel(g){ return LAYERS[g] ? LAYERS[g].label : g; }
  function buildChips(){
    var gb = $("lg-genres"); gb.innerHTML = "";
    GENRES.forEach(function(g){
      var b = document.createElement("button"); b.type = "button"; b.className = "chip";
      b.setAttribute("aria-pressed", gSel[g] ? "true":"false"); b.textContent = gLabel(g);
      b.addEventListener("click", function(){ gSel[g] = !gSel[g]; b.setAttribute("aria-pressed", gSel[g] ? "true":"false"); refreshStart(); });
      gb.appendChild(b);
    });
    var rb = $("lg-regions"); rb.innerHTML = "";
    regions().forEach(function(r){
      var b = document.createElement("button"); b.type = "button"; b.className = "chip";
      b.setAttribute("aria-pressed", rSel[r] ? "true":"false"); b.textContent = REGIONS[r].n;
      b.addEventListener("click", function(){ rSel[r] = !rSel[r]; b.setAttribute("aria-pressed", rSel[r] ? "true":"false"); refreshStart(); });
      rb.appendChild(b);
    });
  }
  /* 地図にしっかり映っている区分だけを出題対象にする(端にわずかに見える区分は除く) */
  function visArea(bb, ctx){
    if(!bb) return 0;
    var x1 = Math.max(bb.x,0), y1 = Math.max(bb.y,0), x2 = Math.min(bb.x+bb.width, ctx.w), y2 = Math.min(bb.y+bb.height, ctx.h);
    if(x2<=x1 || y2<=y1) return 0;
    var vis = (x2-x1)*(y2-y1);
    return vis/(bb.width*bb.height) >= 0.6 ? vis : 0;
  }
  function presentClasses(ctx, L){
    var col2cls = {}, area = {};
    L.classes.forEach(function(c){ col2cls[c[2]] = c[0]; area[c[0]] = 0; });
    Array.prototype.forEach.call(ctx.svg.querySelectorAll(".datamaps-subunit"), function(p){
      var cls = L.map[isoOf(p)]; if(!cls) return;
      var bb; try{ bb = p.getBBox(); }catch(e){ return; }
      area[cls] += visArea(bb, ctx);
    });
    Array.prototype.forEach.call(ctx.svg.querySelectorAll("g[clip-path] > path"), function(p){
      var c = col2cls[p.getAttribute("fill")]; if(!c) return;
      var bb = null;
      try{
        var m = /url\(#([^)]+)\)/.exec(p.parentNode.getAttribute("clip-path") || "");
        var cp = m && ctx.svg.querySelector("#" + m[1] + " > *");
        bb = cp ? cp.getBBox() : p.getBBox();
      }catch(e){ return; }
      area[c] += visArea(bb, ctx);
    });
    var min = ctx.w*ctx.h*0.03;
    return L.classes.filter(function(c){ return area[c[0]] >= min; });
  }
  function start(){
    var n = state.count>0 ? state.count : 10;
    S.n = n; S.idx = 0; S.score = 0;
    show("lq");
    question();
  }
  function question(){
    S.answered = false;
    var combos = [];
    GENRES.forEach(function(g){ if(gSel[g]) regions().forEach(function(r){ if(rSel[r]) combos.push([g,r]); }); });
    combos = shuf(combos);
    var done = false;
    for(var t=0; t<combos.length && t<8 && !done; t++){
      var g = combos[t][0], r = combos[t][1], L = LAYERS[g];
      var ctx = buildMap($("lmap"), r, null);
      if(!ctx || !ctx.datamap){ continue; }
      var present = paintLayer(ctx, g);
      var classes = presentClasses(ctx, L);
      if(classes.length<2) continue;
      var target = classes[Math.floor(Math.random()*classes.length)];
      Array.prototype.forEach.call(ctx.svg.querySelectorAll(".datamaps-subunit"), function(p){
        if(L.map[isoOf(p)]===target[0]) return;
        p.style.setProperty("fill","#ffffff","important"); p.style.setProperty("stroke","#ffffff","important");
      });
      Array.prototype.forEach.call(ctx.svg.querySelectorAll("g[clip-path] > path"), function(p){
        if(p.getAttribute("fill")===target[2]) return;
        p.style.setProperty("fill","#ffffff","important"); p.style.setProperty("stroke","#ffffff","important");
      });
      S.ctx = ctx; S.g = g; S.target = target; S.classes = classes;
      done = true;
    }
    $("lq-progress").textContent = (S.idx+1) + " / " + S.n;
    $("lq-score").textContent = "正解 " + S.score;
    $("lq-bar").style.width = (S.idx/S.n*100) + "%";
    $("lq-legend").innerHTML = ""; $("lq-fb").textContent = ""; $("lq-next").hidden = true;
    if(!done){
      $("lq-title").textContent = ""; $("lq-q").textContent = "出題できる組み合わせがありません。地図データを読み込めていないか、選んだ分布・地域に区分が足りません。設定に戻って選び直してください。";
      $("lq-opts").innerHTML = ""; return;
    }
    $("lq-title").textContent = gLabel(S.g) + "・" + REGIONS[S.ctx.key].n;
    $("lq-q").textContent = "地図に色が塗られている「" + gLabel(S.g) + "」の区分は、どれですか？";
    var others = shuf(S.classes.filter(function(c){ return c[0]!==S.target[0]; })).slice(0,3);
    var opts = shuf(others.concat([S.target])), box = $("lq-opts"); box.innerHTML = "";
    opts.forEach(function(c){
      var b = document.createElement("button"); b.type = "button"; b.className = "lq-opt"; b.setAttribute("data-c", c[0]); b.textContent = nm(c);
      b.addEventListener("click", function(){ answer(b); });
      box.appendChild(b);
    });
  }
  function answer(b){
    if(S.answered) return; S.answered = true;
    var ok = b.getAttribute("data-c")===S.target[0]; if(ok) S.score++;
    Array.prototype.forEach.call($("lq-opts").querySelectorAll(".lq-opt"), function(o){ if(o.getAttribute("data-c")===S.target[0]) o.classList.add("ok"); });
    if(!ok) b.classList.add("ng");
    $("lq-fb").textContent = (ok ? "正解です。" : "不正解です。") + "塗られていたのは「" + nm(S.target) + "」です。";
    $("lq-score").textContent = "正解 " + S.score;
    var present = paintLayer(S.ctx, S.g), L = LAYERS[S.g];
    var lg = '<div class="llegend">' + L.classes.filter(function(c){ return S.classes.some(function(x){ return x[0]===c[0]; }); }).map(function(c){
      return '<span><i style="background:' + c[2] + '"></i>' + esc(c[1]) + '</span>';
    }).join("") + '</div>';
    $("lq-legend").innerHTML = lg;
    $("lq-bar").style.width = ((S.idx+1)/S.n*100) + "%";
    $("lq-next").textContent = S.idx+1>=S.n ? "結果を見る" : "次の問題"; $("lq-next").hidden = false;
  }
  function next(){
    if(S.idx+1>=S.n){
      $("lq-opts").innerHTML = ""; $("lq-legend").innerHTML = "";
      $("lq-q").textContent = "結果:" + S.n + "問中 " + S.score + "問正解";
      $("lq-fb").textContent = S.score===S.n ? "全問正解です。" : "間違えた区分は、地図の凡例を見直しておきましょう。";
      $("lq-next").textContent = "設定に戻る"; S.idx = S.n; return;
    }
    S.idx++; question();
  }
  $("lq-next").addEventListener("click", function(){
    if(S.idx>=S.n){ refreshStart(); show("start"); return; }
    next();
  });
  $("lq-quit").addEventListener("click", function(){ refreshStart(); show("start"); });
  return {genres:GENRES, gSel:gSel, rSel:rSel, regions:regions, buildChips:buildChips, start:start};

      c.cols.forEach(function(k, i){
        var x = pn(r[k]); if(x==null){ pen = false; return; }
        var px = xp(i), py = Y0 + H - H*x/mx;
        d += (pen ? "L" : "M") + px.toFixed(1) + " " + py.toFixed(1); pen = true;
        o += '<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="2.4" class="f' + (j%12+1) + '"/>';
      });
      o = '<path d="' + d + '" class="ln st' + (j%12+1) + '"/>' + o;
    });
    var lg = legend(S.map(function(r){ return r[0]; }), Y0 + H + 34);

  }
  function cDumb(t, c){
    var R = rowsOf(t, c), L = lw(R), rh = 17, bw = SW - L - 40, o = "", mx = 0;
    R.forEach(function(r){ [c.a, c.b].forEach(function(k){ var x = pn(r[k]); if(x!=null && x>mx) mx = x; }); });
    var lg = legend(c.nm, 12);
    R.forEach(function(r, i){
      var y = lg.h + 6 + i*rh + 10, a = pn(r[c.a]), b = pn(r[c.b]);

      var xa = L + a/mx*bw, xb = L + b/mx*bw;
      o += tx(L-4, y+3, lab(r[0]), "cl", "end") + '<line x1="' + xa + '" x2="' + xb + '" y1="' + y + '" y2="' + y + '" class="gl2"/><circle cx="' + xa + '" cy="' + y + '" r="3.2" class="f1"/><circle cx="' + xb + '" cy="' + y + '" r="3.2" class="f2"/>' + tx(Math.max(xa, xb)+6, y+3, fmt(b), "cv s");
    });
    return [c.cap || "", svg(lg.h + 12 + R.length*rh + 6, lg.s + o)];
  }
  function cHeat(t, c){
    var R = rowsOf(t, c), L = lw(R), n = c.cols.length, cw = (SW - L - 4)/n, rh = 20, o = "";
    c.nm.forEach(function(s, j){ o += tx(L + cw*j + cw/2, 12, s, "cv s", "middle"); });
    R.forEach(function(r, i){
      var y = 18 + i*rh;
      o += tx(L-4, y+14, lab(r[0]), "cl", "end");
      c.cols.forEach(function(k, j){
        var vv = pn(r[k]), op = vv==null ? 0 : Math.min(vv, 150)/150*0.85 + 0.06;

      });
    });
    return [c.cap || "", svg(18 + R.length*rh + 4, o)];
  }
  var CH = {bar:cBar, gbar:cGbar, stack:cStack, stackT:cStackT, line:cLine, dumb:cDumb, heat:cHeat};
  function charts(t){
    var cs = t.ch || ((t.rk && t.pc!=null) ? [{type:"bar", v:t.pc, tx:t.pc-1}] : []);

    }).join("");
  }
  function render(){
    var tabs = $("stats-tabs"); tabs.innerHTML = "";

      tabs.appendChild(b);
    });

  }

})();

var SQ = (function(){
  var S = {list:[], i:0, ok:0, ans:false, cur:null, opts:[]};
  function shuffle(a){ a = a.slice(); for(var i = a.length-1; i>0; i--){ var j = Math.floor(Math.random()*(i+1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  var L = ["A","B","C"], CN = "①②③④⑤⑥";
  function findTable(pre){
    var r = null;
    STATS.G.forEach(function(g){ g.tables.forEach(function(t){ if(!r && t.t.indexOf(pre)===0) r = t; }); });
    return r;
  }
  function maskName(n, mask){
    for(var k in mask){ if(n===k || n.indexOf(k + "(")===0) return mask[k]; }
    return null;
  }
  function build(sp, mask){
    var t = JSON.parse(JSON.stringify(findTable(sp.t)));
    var rows = t.r;
    if(sp.rows){
      var byName = {}; rows.forEach(function(r){ byName[r[0]] = r; });
      var keep = {}; sp.rows.forEach(function(n){ keep[n] = 1; });
      rows = rows.filter(function(r){ return keep[r[0]] || keep[String(r[0]).split("(")[0]]; });
    }
    var cols = sp.cols;
    if(cols){
      t.h = cols.map(function(k){ return t.h[k]; });
      rows = rows.map(function(r){ return cols.map(function(k){ return r[k]; }); });
    }
    if(sp.h) t.h = sp.h;
    t.mk = [];
    rows = rows.map(function(r){
      var m = maskName(String(r[0]), mask);
      t.mk.push(!!m);
      if(m){ r = r.slice(); r[0] = m; }
      return r;
    });
    t.r = rows; t.tot = null; t.n = ""; t.s = ""; t.ch = sp.ch || (sp.cols ? [] : t.ch);
    return t;
  }
  function perms(a){
    if(a.length<=1) return [a];
    var out = [];
    a.forEach(function(x, i){ perms(a.slice(0,i).concat(a.slice(i+1))).forEach(function(p){ out.push([x].concat(p)); }); });
    return out;
  }
  function prep(q){
    var mask = {}; q.ans.forEach(function(n, i){ mask[n] = L[i]; });
    var pool = q.ans.slice(1).concat(q.ans.slice(0,1));
    var lead = q.intro + (q.fmt==="perm"
      ? "A〜Cは、" + pool.join("、") + "のいずれかである。A〜Cと" + q.kind + "名の正しい組合せを、次の①〜⑥のうちから一つ選べ。"
      : "A〜Cは、" + q.symNames.map(function(n, i){ return n + "(" + ["◯","⬜︎","☆"][i] + ")"; }).join("、") + "のいずれかである。" + ["◯","⬜︎","☆"][q.ask] + "にあたるものを、A〜Cのうちから一つ選べ。");
    var opts;
    if(q.fmt==="perm"){
      var key = q.ans.join("|");
      opts = shuffle(perms(q.ans)).map(function(p){ return {txt:p, ok:p.join("|")===key}; });
    } else {
      var right = q.ans.indexOf(q.symNames[q.ask]);
      opts = L.map(function(l, i){ return {txt:l, ok:i===right}; });
    }
    return {q:q, mask:mask, lead:lead, opts:opts};
  }
  function render(){
    var p = S.cur, q = p.q;
    $("sq-progress").textContent = (S.i+1) + " / " + S.list.length;
    $("sq-score").textContent = "正解 " + S.ok;
    $("sq-bar").style.width = (S.i/S.list.length*100) + "%";
    $("sq-th").textContent = q.th;
    $("sq-lead").textContent = p.lead;
    $("sq-stats").innerHTML = q.stats.map(function(sp){ return STATS_API.tbl(build(sp, p.mask)); }).join("");
    var box = $("sq-opts"); box.innerHTML = "";
    p.opts.forEach(function(o, i){
      var b = document.createElement("button"); b.type = "button"; b.className = "sq-opt" + (q.fmt==="perm" ? " perm" : "");
      b.innerHTML = q.fmt==="perm"
        ? '<span class="sq-no">' + CN[i] + '</span>' + o.txt.map(function(n, j){ return '<span class="sq-p"><b>' + L[j] + '</b>' + esc(n) + '</span>'; }).join("")
        : '<span class="sq-no">' + o.txt + '</span>';
      b.addEventListener("click", function(){ pick(i, b); });
      box.appendChild(b);
    });
    $("sq-fb").innerHTML = ""; $("sq-fb").className = "sq-fb";
    $("sq-next").hidden = true; S.ans = false;
    window.scrollTo(0, 0);
  }
  function pick(i, b){
    if(S.ans) return; S.ans = true;
    var p = S.cur, ok = p.opts[i].ok;
    if(ok) S.ok++;
    var bs = $("sq-opts").children;
    for(var k = 0; k<bs.length; k++){ bs[k].disabled = true; if(p.opts[k].ok) bs[k].classList.add("ok"); }
    if(!ok) b.classList.add("ng");
    var q = p.q;
    var rev = q.ans.map(function(n, j){ return L[j] + ' = ' + esc(n); }).join(" ・ ");
    $("sq-fb").className = "sq-fb " + (ok ? "ok" : "ng");
    $("sq-fb").innerHTML = '<p class="sq-v">' + (ok ? "正解" : "不正解") + '</p><p class="sq-rev">' + rev + '</p>' + q.ex.map(function(t){ return '<p>' + esc(t) + '</p>'; }).join("");
    $("sq-score").textContent = "正解 " + S.ok;
    $("sq-next").textContent = S.i+1>=S.list.length ? "結果を見る" : "次の問題"; $("sq-next").hidden = false;
  }
  function next(){
    S.i++;
    if(S.i>=S.list.length){ finish(); return; }
    S.cur = prep(S.list[S.i]); render();
  }
  function finish(){
    $("sq-res-text").textContent = S.list.length + "問中 " + S.ok + "問正解";
    show("sqr");
  }
  function start(n){
    S.list = shuffle(SQS).slice(0, n || 10); S.i = 0; S.ok = 0;
    S.cur = prep(S.list[0]); show("sq"); render();
  }
  function one(i){ S.list = [SQS[i]]; S.i = 0; S.ok = 0; S.cur = prep(S.list[0]); show("sq"); render(); return SQS.length; }
  return {start:start, next:next, one:one};
})();

function startQuiz(weak){
  var pool;
  if(weak){
    var ids = weakIds();
    pool = items().filter(function(c){ return ids.indexOf(wid(c))>=0; });
  }else{
    pool = items().filter(function(c){ return state.regions[groupOf(c)] && inScope(c); });
  }
  pool = shuffle(pool);
  if(!weak && state.count>0) pool = pool.slice(0, state.count);
  if(pool.length===0) return;
  state.pool = pool; state.idx = 0; state.score = 0; state.miss = []; state.weakMode = !!weak;
  show("quiz");
  showQuestion();
}
function optionsFor(city){
  if(city.k==="国") return ANS_ORDER.slice();
  var all = uniq(CITIES.map(function(c){ return c.c; }));
  var inRegion = uniq(CITIES.filter(function(c){ return c.g===city.g && c.c!==city.c; }).map(function(c){ return c.c; }));
  var near = uniq(CITIES.filter(function(c){ return NEAR[city.g].indexOf(c.g)>=0 && c.c!==city.c; }).map(function(c){ return c.c; }));
  var ex = [city.c].concat(city.alt||[]);
  inRegion = inRegion.filter(function(x){ return ex.indexOf(x)<0; }); near = near.filter(function(x){ return ex.indexOf(x)<0; });
  var lim = 3 - (city.alt||[]).length;
  var picks = shuffle(inRegion).slice(0,Math.min(2,lim));
  shuffle(near).forEach(function(x){ if(picks.length<lim && picks.indexOf(x)<0) picks.push(x); });
  shuffle(all).forEach(function(x){ if(picks.length<lim && picks.indexOf(x)<0 && ex.indexOf(x)<0) picks.push(x); });
  return shuffle(picks.concat(ex));
}
function showQuestion(){
  var city = state.pool[state.idx];
  state.answered = false;
  $("q-progress").textContent = "第" + (state.idx+1) + "問 / " + state.pool.length;
  $("q-score").textContent = "正解 " + state.score;
  $("q-bar").style.width = ((state.idx)/state.pool.length*100) + "%";
  $("q-ruby").textContent = city.k + "  " + city.r;
  $("q-ask").textContent = city.k==="国" ? "この国があるのは、どの地域ですか。" : city.k==="都市" ? "この都市がある国はどこですか。" : "この地名は、どの国にありますか(国土・領土)。";
  $("q-city").textContent = city.n;
  var box = $("q-choices"); box.innerHTML = "";
  optionsFor(city).forEach(function(name, i){
    var b = document.createElement("button");
    b.type = "button"; b.className = "choice"; b.setAttribute("data-c", name);
    b.innerHTML = '<span class="k">' + "ABCDEF"[i] + '</span><span>' + esc(name) + '</span>';
    b.addEventListener("click", function(){ answer(name); });
    box.appendChild(b);
  });
  var ex = $("q-explain"); ex.hidden = true; ex.innerHTML = "";
  window.scrollTo(0,0);
}
function answer(name){
  if(state.answered) return;
  state.answered = true;
  var city = state.pool[state.idx];
  var right = (name===city.c || (city.alt && city.alt.indexOf(name)>=0));
  var wrong = loadWrong();
  if(right){
    state.score++;
    wrong = wrong.filter(function(id){ return id!==wid(city); });
  }else{
    state.miss.push(city);
    if(wrong.indexOf(wid(city))<0) wrong.push(wid(city));
  }
  saveWrong(wrong);
  Array.prototype.forEach.call($("q-choices").querySelectorAll(".choice"), function(b){
    var c = b.getAttribute("data-c");
    b.disabled = true;
    if(c===city.c || (city.alt && city.alt.indexOf(c)>=0)) b.classList.add("ok");
    else if(c===name) b.classList.add("ng");
    else b.classList.add("dim");
  });
  $("q-score").textContent = "正解 " + state.score;
  $("q-bar").style.width = ((state.idx+1)/state.pool.length*100) + "%";
  renderExplain(city, right, name);
}

      out += '<p class="src-note">地図データを読み込めなかったため、色を付けて表示できません。ページを再読み込みしてください。</p>';
    }else{
      out += '<div class="llegend">' + L.classes.filter(function(c){ return present.indexOf(c[0])>=0; }).map(function(c){
        var sw = '<i style="background:' + c[2] + '"></i>';
        return '<span>' + sw + esc(c[1]) + '</span>';
      }).join("") + ('<span><i class="none"></i>' + (L.nonetxt || '色なし(対象外・データなし)') + '</span>') + '</div>';
      if(present.length===0) out += '<p class="src-note">この地図の範囲には、色を付ける国がありません。</p>';
    }
    if(L.table && present!==null){
      out += '<table class="ctable"><thead><tr><th>植民地</th><th>宗主国(最初の宗主国→次の宗主国)</th></tr></thead><tbody>' + L.table.map(function(r){ return '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td></tr>'; }).join("") + '</tbody></table>';
    }
    return out;
  }
  function apply(){
    syncB();
    var ctx = getCtx(); if(!ctx) return;
    var sub = root.querySelector(".lsub:not(.lsub2):not(.lsub3)"); sub.hidden = (lastLayer!=="grp");
    if(lastLayer==="grp") setGroup(lastGroup);
    Array.prototype.forEach.call(root.querySelectorAll(".lchip2"), function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-g")===lastGroup ? "true" : "false");
    });
    var sub2 = root.querySelector(".lsub2"); sub2.hidden = (lastLayer!=="agr");
    var anyLn = false;
    Array.prototype.forEach.call(root.querySelectorAll(".lchip6"), function(b){
      var k = b.getAttribute("data-ln"), ok = lineOk(k, ctx);
      b.hidden = !ok; if(ok) anyLn = true;
      b.setAttribute("aria-pressed", lineSel[k] ? "true" : "false");
    });
    var lt = root.querySelector(".lsubt-ln"); if(lt) lt.hidden = !anyLn;
    var sub3 = root.querySelector(".lsub3"); sub3.hidden = (lastLayer!=="mi");
    Array.prototype.forEach.call(root.querySelectorAll(".lchip5"), function(b){
      b.setAttribute("aria-pressed", minSel[b.getAttribute("data-m")] ? "true" : "false");
    });
    Array.prototype.forEach.call(root.querySelectorAll(".lchip3:not(.lchip5):not(.lchip6)"), function(b){
      b.setAttribute("aria-pressed", cropSel[b.getAttribute("data-c")] ? "true" : "false");
    });
    var present = paintLayer(ctx, lastLayer==="mi" ? "" : lastLayer);
    if(lastLayer==="agr" && present!==null) drawMarks(ctx, CROPS, cropSel);
    if(lastLayer==="agr" && present!==null) drawLines(ctx);
    if(lastLayer==="mi") drawMarks(ctx, MINES, minSel);
    body.innerHTML = legend(lastLayer, present);
    if(lastLayer==="agr" && lineSel.qh && lineOk("qh", ctx)) body.innerHTML += '<p class="legend-note">チンリン・ホワイ線(赤い線)より北は小麦地域、南は稲作地域です。</p>';
    if(lastLayer==="lang" || lastLayer==="fam" || lastLayer==="eth") buildInsets(body, ctx, lastLayer);
    Array.prototype.forEach.call(root.querySelectorAll(".lchip"), function(b){
      b.setAttribute("aria-pressed", b.getAttribute("data-l")===lastLayer ? "true" : "false");
    });
  }
  Array.prototype.forEach.call(root.querySelectorAll(".lchip"), function(b){
    b.addEventListener("click", function(){
      var l = b.getAttribute("data-l");
      lastLayer = (l===lastLayer) ? "" : l;
      apply();
    });
  });
  Array.prototype.forEach.call(root.querySelectorAll(".lchip2"), function(b){
    b.addEventListener("click", function(){ lastGroup = b.getAttribute("data-g"); lastLayer = "grp"; apply(); });
  });
  Array.prototype.forEach.call(root.querySelectorAll(".lchip3:not(.lchip5):not(.lchip6)"), function(b){
    b.addEventListener("click", function(){ var k = b.getAttribute("data-c"); cropSel[k] = !cropSel[k]; apply(); });
  });
  Array.prototype.forEach.call(root.querySelectorAll(".lchip6"), function(b){
    b.addEventListener("click", function(){ var k = b.getAttribute("data-ln"); lineSel[k] = !lineSel[k]; apply(); });
  });
  Array.prototype.forEach.call(root.querySelectorAll(".lchip5"), function(b){
    b.addEventListener("click", function(){ var k = b.getAttribute("data-m"); minSel[k] = !minSel[k]; apply(); });
  });
  return apply;
}
var mapRebuild = null;
var resizeTimer = null, lastAvail = 0;
window.addEventListener("resize", function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){
    if(!mapCtx || !mapRebuild) return;
    var avail = Math.floor(mapCtx.box.parentElement.clientWidth);
    if(Math.abs(avail - lastAvail) > 8){ lastAvail = avail; mapRebuild(); }
  }, 200);
});

/* ---------- 分布地図(クイズと別に、地域と分布を選んで見る) ---------- */
var atlasKey = "wd";
function buildAtlasChips(){
  var box = $("atlas-regions"); box.innerHTML = "";
  ["wd"].concat(REGION_ORDER).forEach(function(k){
    var b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.setAttribute("aria-pressed", k===atlasKey ? "true":"false");
    b.textContent = REGIONS[k].n;
    b.addEventListener("click", function(){ atlasKey = k; buildAtlasChips(); mapRebuild(); });
    box.appendChild(b);
  });
}
function openAtlas(){
  show("atlas");
  buildAtlasChips();
  var apply = mountLayers($("atlas-layers"), function(){ return mapCtx; });
  atlasApply = apply;
  mapRebuild = function(){ mapCtx = buildMap($("amap"), atlasKey, null); apply(); };
  lastAvail = Math.floor($("amap").parentElement.clientWidth);
  mapRebuild();
}

/* ---------- 結果 ---------- */
function finish(){
  var total = state.pool.length;
  $("r-score").textContent = state.score;
  $("r-total").textContent = "/ " + total + " 問正解";
  var rate = state.score/total;
  var msg = rate===1 ? "全問正解です。別の地域や、全問モードにも挑戦してみましょう。"
          : rate>=0.8 ? "よくできています。間違えた問題の特色と歴史を、もう一度確認しておきましょう。"
          : rate>=0.5 ? "半分以上正解です。間違えた問題は復習モードで繰り返せます。"
          : "まずは地域ごとに絞って練習すると覚えやすくなります。間違えた問題は復習モードで繰り返せます。";
  $("r-msg").textContent = msg;
  var ul = $("r-miss"); ul.innerHTML = "";
  state.miss.forEach(function(c){
    var li = document.createElement("li");
    li.innerHTML = c.k==="国" ? '<b>' + esc(c.n) + '</b><span>' + esc([c.c].concat(c.alt||[]).join("・")) + '</span>' : '<b>' + esc(c.n) + '</b><span>' + esc(c.c) + '(' + esc(REGIONS[c.g].n) + ')</span>';
    ul.appendChild(li);
  });
  $("r-miss-wrap").hidden = state.miss.length===0;
  var weakCount = weakIds().length;
  $("r-weak").hidden = weakCount===0;
  $("r-weak").textContent = "間違えた問題を復習(" + weakCount + ")";
  show("result");
}

/* ---------- ライト/ダーク切り替え ---------- */
(function(){
  var root = document.documentElement, btn = document.getElementById("theme-btn");
  function stored(){ try{ return localStorage.getItem("geo-theme"); }catch(e){ return null; } }
  function save(v){ try{ localStorage.setItem("geo-theme", v); }catch(e){} }
  function effective(){
    var t = root.getAttribute("data-theme");
    if(t==="dark" || t==="light") return t;
    return (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
  }
  function label(){ var d = effective()==="dark"; btn.textContent = d ? "🌙" : "☀️"; btn.setAttribute("aria-label", d ? "ダークモード中(押すとライトモード)" : "ライトモード中(押すとダークモード)"); }
  var s = stored(); if(s==="dark" || s==="light") root.setAttribute("data-theme", s);
  label();
  btn.addEventListener("click", function(){
    var n = effective()==="dark" ? "light" : "dark";
    root.setAttribute("data-theme", n); save(n); label();
  });
  if(window.matchMedia){ try{ window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", label); }catch(e){} }
})();


})();
